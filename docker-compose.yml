services:
  postgres:
    image: postgres:16-alpine
    # Only reachable on the compose network (no published port), so the
    # default password isn't exposed. Override POSTGRES_PASSWORD if you like.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batter}
      POSTGRES_DB: ${POSTGRES_DB:-batter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batter}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  batter:
    build: .
    ports:
      # Plain HTTP stays on this machine; everyone else comes in via caddy
      # (HTTPS), which browsers require for live video.
      - "${BATTER_PORT:-127.0.0.1:3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-batter}:${POSTGRES_PASSWORD:-batter}@postgres:5432/${POSTGRES_DB:-batter}?sslmode=disable
      PORT: "8080"
      # Optional overrides; every one has a working default (see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # caddy -> Next.js (in-container) -> backend: believe X-Forwarded-For
      # from the in-container hop so rate limits see real client IPs.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
    depends_on:
      postgres:
        condition: service_healthy
    privileged: true
    # Room for the backend to drain requests (10s) and stop device sessions.
    stop_grace_period: 30s
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - batter_data:/app/data
      # adb's key: phones authorize it once ("Allow USB debugging?"), so it
      # must survive container rebuilds or every phone re-prompts per update.
      - adb_keys:/root/.android
    healthcheck:
      # Probes the Go backend's /health on :8080 — the real liveness signal,
      # since the Next.js frontend can keep serving even if the API is down.
      # Uses node (present in the image); the image has no wget/curl.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    # Host networking: listens on the box's :80/:443 directly, so certificates
    # are issued for the address clients actually use (LAN, NetBird, ...).
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - batter
    restart: unless-stopped

volumes:
  pgdata:
  batter_data:
  adb_keys:
  caddy_data:
  caddy_config:
