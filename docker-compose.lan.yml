# The phone network: phones on USB-C ethernet adapters, on a switch plugged
# into a second NIC of this box. Batter is that network's DHCP server and
# router, and lets each phone out only through its VPN profile.
#
# Turn it on in .env (see docs/DEPLOY.md, "Phone network"):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.lan.yml
#   PHONE_LAN_PARENT=enp2s0   # the NIC the phones' switch is on
services:
  batter:
    environment:
      # Batter's address on the phone network (the phones' gateway and DNS
      # server) and the DHCP pool. Docker's own assignments (ip_range below,
      # and the gateway address it reserves) stay out of the pool.
      PHONE_LAN: 10.77.0.1/24
      PHONE_LAN_POOL: 10.77.0.100-10.77.0.250
    sysctls:
      # Containers inherit the host's forwarding (on with Docker). Start
      # with it off: Batter turns it on once the phone network is fenced,
      # so phones are never routed before the firewall is in.
      net.ipv4.ip_forward: "0"
    networks:
      default:
        # Two networks: keep the container's default route (Batter's own
        # traffic, VPN servers) on the normal one. Needs Docker 28+;
        # Batter refuses to route phones if the default goes to the phones.
        gw_priority: 1
      phones:
        ipv4_address: 10.77.0.1

networks:
  phones:
    driver: macvlan
    driver_opts:
      parent: ${PHONE_LAN_PARENT:?set PHONE_LAN_PARENT in .env to the NIC the phones' switch is on}
    ipam:
      config:
        - subnet: 10.77.0.0/24
          ip_range: 10.77.0.0/29
          gateway: 10.77.0.254
